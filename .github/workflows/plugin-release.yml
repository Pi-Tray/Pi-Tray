name: Plugin release

# called from a plugin's repo, which needs @pi-tray/plugin-build as a dev dependency:
#
#   on:
#     push:
#       branches: [main]
#       tags: ["v*"]
#   permissions:
#     contents: write
#   jobs:
#     release:
#       uses: Pi-Tray/Pi-Tray/.github/workflows/plugin-release.yml@plugin-build-v<version>
#
# pin it to the same plugin-build-v tag as the plugin's @pi-tray/plugin-build, so the workflow and the tool it runs match
#
# every push builds each target as a check, a v<version> tag also publishes them as a release with manifest.json

on:
  workflow_call:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      node_version: ${{ steps.plan.outputs.node_version }}
    steps:
      - uses: actions/checkout@v4

      # the runner's own node is enough to see which packages are native, nothing is compiled or built here
      - run: npm ci --ignore-scripts

      # the targets (just "any" for a plugin without native modules) and the node the server ships with,
      # which the tool knows from when it was built
      - id: plan
        run: |
          plan=$(npx pi-tray-plugin plan)
          echo "matrix=$(node -p 'JSON.stringify(JSON.parse(process.argv[1]).matrix)' "$plan")" >> "$GITHUB_OUTPUT"
          echo "node_version=$(node -p 'JSON.parse(process.argv[1]).node_version' "$plan")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node_version }}

      # installs on this runner's own platform, using native modules' prebuilds or compiling them here
      - run: npm ci

      - name: Type check
        shell: bash
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          fi

      - run: npx pi-tray-plugin build --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.target }}
          path: plugin-dist/*
          retention-days: 3

  release:
    needs: [plan, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.plan.outputs.node_version }}

      # only to run the tool, nothing is built here
      - run: npm ci --ignore-scripts

      - name: Check the tag matches the package version
        run: |
          package_version=$(node -p "require('./package.json').version")
          if [ "v$package_version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} doesn't match package version $package_version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-*
          path: plugin-dist
          merge-multiple: true

      - run: >
          npx pi-tray-plugin manifest
          --base-url "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          --release-notes-url "${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          --repository-url "${{ github.server_url }}/${{ github.repository }}"

      # the installer can always find the newest version at releases/latest/download/manifest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" plugin-dist/*.tgz plugin-dist/manifest.json \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
