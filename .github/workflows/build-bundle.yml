name: Build app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    # changes to any of the apps or packages that are included in the bundle should trigger a rebuild to sanity check
    branches:
      - main
    paths:
      - "apps/editor/**"
      - "apps/server/**"
      - "apps/supervisor/**"
      - "apps/package-manager/**"
      - "apps/cli/**"
      - "packages/types/**"
      - "packages/secure-channel/**"
      - "packages/paths/**"
      - "packages/installer/**"
      - "packages/package-spec/**"
      - "packages/server-config/**"
      - "packages/ui/**"
      - "scripts/**"
      - "package.json"
      - "build/keys/**"
      - "apps/client/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-bundle.yml"

permissions:
  contents: write

# Auto-cancels active runs on the same branch when a new commit is pushed.
# Tag pushes (releases) are isolated by their specific tag name so they don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.determine.outputs.should_publish }}
      release_tag: ${{ steps.determine.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: determine
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # the version comes from the root package.json, so a tag that doesn't match would publish mislabelled builds
            app_version="$(node -p "require('./package.json').version")"
            if [ "${{ github.ref_name }}" != "v$app_version" ]; then
              echo "::error::Tag ${{ github.ref_name }} doesn't match the version in package.json (v$app_version). Run node scripts/set-version.mjs first"
              exit 1
            fi

            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-tauri:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest" # TODO: set up cross compilation to produce nsis on ubuntu
            args: ""

    runs-on: ${{ matrix.platform }}
    # the client signing key is a secret of the protected release environment, only available to tag builds
    environment: ${{ github.ref_type == 'tag' && 'release' || 'ci' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Cache apt packages
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/editor/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/editor/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_SIGNING_KEY: ${{ secrets.CLIENT_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/editor
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.updater.conf.json' || '' }}

      - name: Prepare artifact paths
        id: prep_paths
        shell: bash
        run: |
          # both macos builds name their update archive Pi-Tray.app.tar.gz, so it gets the architecture added
          arch="${{ contains(matrix.args, 'aarch64') && 'aarch64' || 'x64' }}"

          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          echo '${{ steps.tauri-build.outputs.artifactPaths }}' | jq -r '.[]' | while IFS= read -r artifact; do
            case "$artifact" in
              *.app.tar.gz|*.app.tar.gz.sig)
                renamed="$(dirname "$artifact")/$(basename "$artifact" | sed "s/\.app\.tar\.gz/_${arch}.app.tar.gz/")"
                mv "$artifact" "$renamed"
                artifact="$renamed"
                ;;
            esac
            echo "$artifact"
          done >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # Always upload files to a temporary workflow-run bridge so they can be collected later.
      # If publishing, these temporary artifacts are set to expire in 1 single day to stay clear of your 500MB quota.
      - name: Upload build artifacts
        id: upload_step
        uses: actions/upload-artifact@v4
        with:
          name: tauri-binaries-${{ matrix.platform }}-${{ matrix.args || 'default' }}
          path: ${{ steps.prep_paths.outputs.paths }}
          retention-days: ${{ needs.check.outputs.should_publish == 'true' && 1 || 2 }}

      # Clean up older historical testing artifacts for this matrix block if this is a standard commit run
      - name: Prune older platform artifacts
        if: always() && needs.check.outputs.should_publish == 'false' && steps.upload_step.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PREFIX="tauri-binaries-${{ matrix.platform }}-${{ matrix.args || 'default' }}"
          CURRENT_ID="${{ steps.upload_step.outputs.artifact-id }}"
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            --jq ".artifacts[] | select(.name == \"$PREFIX\") | select(.id != $CURRENT_ID) | .id" | \
            while read -r old_id; do
              if [ -n "$old_id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$old_id" || true
              fi
            done

  publish:
    needs: [check, build-tauri]
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create local download directory
        run: mkdir dist-bins

      # Downloads all compiled binaries produced across your different cross-compilation runners
      - name: Download all compiled matrix binaries
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-binaries-*
          path: dist-bins
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ needs.check.outputs.release_tag }}"

          # the artifacts keep each bundle type in its own folder, and macos also includes the .app folder itself
          mapfile -t assets < <(find dist-bins -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.sig' \))
          printf 'Uploading %s\n' "${assets[@]}"
          
          # a stable release is what the repo's front page should send people to. image and plugin releases never are
          if [[ "$release_tag" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          else
            release_flags=(--latest)
          fi
          
          # github's generated changelog first, with a pointer to the pi image after it
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$release_tag" --jq .body > release-notes.md
          cat >> release-notes.md <<EOF
          
          ---
          Setting up a new Raspberry Pi? Get the image from the [latest image release](https://github.com/${{ github.repository }}/releases/tag/image-latest). Pis already set up update themselves.
          EOF
            
          if gh release view "$release_tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --repo "${{ github.repository }}" --clobber
            gh release edit "$release_tag" "${release_flags[@]}" --repo "${{ github.repository }}"
          else
            gh release create "$release_tag" "${assets[@]}" --repo "${{ github.repository }}" --title "$release_tag" \
           --notes-file release-notes.md "${release_flags[@]}"
          fi
          
      - name: Update the rolling editor-latest release
        if: ${{ !contains(needs.check.outputs.release_tag, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view editor-latest --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create editor-latest --repo "${{ github.repository }}" --title "Latest Editor App Assets" \
              --notes "Rolling release reflecting the absolute newest stable compilation of the editor desktop binary applications." \
              --latest=false
          fi
          # the artifacts keep each bundle type in its own folder, and macos also includes the .app folder itself
          mapfile -t assets < <(find dist-bins -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.app.tar.gz' -o -name '*.sig' \))
          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload editor-latest "${assets[@]}" --repo "${{ github.repository }}" --clobber

      # after editor-latest exists, as the installed apps check for updates there
      - name: Publish the update manifest
        if: ${{ !contains(needs.check.outputs.release_tag, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ needs.check.outputs.release_tag }}"
          base_url="https://github.com/${{ github.repository }}/releases/download/$release_tag"
          platforms='{}'

          while IFS= read -r signature_path; do
            asset="$(basename "${signature_path%.sig}")"
            case "$asset" in
              *-setup.exe) key=windows-x86_64-nsis ;;
              *.msi) key=windows-x86_64-msi ;;
              *_amd64.AppImage) key=linux-x86_64-appimage ;;
              *_amd64.deb) key=linux-x86_64-deb ;;
              *.x86_64.rpm) key=linux-x86_64-rpm ;;
              *_aarch64.app.tar.gz) key=darwin-aarch64-app ;;
              *_x64.app.tar.gz) key=darwin-x86_64-app ;;
              *) continue ;;
            esac
            platforms=$(jq --arg key "$key" --arg url "$base_url/$asset" --rawfile signature "$signature_path" \
              '. + {($key): {url: $url, signature: ($signature | rtrimstr("\n"))}}' <<< "$platforms")
          done < <(find dist-bins -type f -name '*.sig')

          jq -n --arg version "${release_tag#v}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, pub_date: $date, notes: "", platforms: $platforms}' > latest.json
          cat latest.json

          gh release upload "$release_tag" latest.json --repo "${{ github.repository }}" --clobber
          gh release upload editor-latest latest.json --repo "${{ github.repository }}" --clobber
