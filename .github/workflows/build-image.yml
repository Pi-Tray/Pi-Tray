name: Build image

on:
  workflow_dispatch:
  push:
    tags:
      - "image-v*"
    branches:
      - main
    paths:
      #- "apps/client/**" dont rebuild every client change or storage and mins quota is swallowed! manually tag image releases when a new client is ready to be included
      # if image build scripts change, rebuild the image to check it still works
      - "apps/image/**"
      # new images start out trusting the current keys
      - "build/keys/**"
      - ".github/workflows/build-image.yml"
  # releases made in GitHub's web UI, so their images are built and attached to them
  release:
    types:
      - published
  # checks for a new Raspberry Pi OS Lite release every monday, and only builds if there is one
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

# a release made in the web UI can also fire a tag push, so runs for the same release wait for each other
# rather than racing to upload the same files
concurrency:
  group: image-${{ github.event.release.tag_name || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest

    outputs:
      base_image_url: ${{ steps.resolve.outputs.base_image_url }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}

    steps:
      - name: Resolve the latest base image
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the "latest" link redirects to a dated file, e.g. .../2025-10-01-raspios-trixie-arm64-lite.img.xz
          base_image_url=$(curl --fail --silent --show-error --location --head --output /dev/null --write-out '%{url_effective}' https://downloads.raspberrypi.com/raspios_lite_arm64_latest)
          base_image_name=$(basename "$base_image_url" .img.xz)

          echo "Latest base image: $base_image_name"
          echo "base_image_url=$base_image_url" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "schedule" ]; then
            # one automatic release per base image, so an existing release means it's already been built
            release_tag="image-os-$base_image_name"
          
            # rebuild the latest stable image release on the new base, never whatever main has right now
            source_ref=$(git ls-remote --tags --refs --sort=-v:refname "https://github.com/${{ github.repository }}.git" 'image-v*' \
              | awk '{ sub("refs/tags/", "", $2); print $2 }' \
              | grep -E '^image-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)

            if [ -z "$source_ref" ]; then
              echo "::error::No stable image-v* tag to build from"
              exit 1
            fi

            echo "Building from $source_ref"
            echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

            if gh release view "$release_tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
              echo "Already built, nothing to do"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi

            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            release_tag="${{ github.event.release.tag_name }}"

            # every app's releases fire this, only image ones are built here
            # image-latest is the rolling release this workflow updates itself, so it's never built from
            if [[ "$release_tag" == image-* ]] && [ "$release_tag" != "image-latest" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Not an image release, nothing to do"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi

            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            release_tag="${{ github.ref_name }}"
            echo "should_build=true" >> "$GITHUB_OUTPUT"

            # manual runs and main pushes only produce an artifact, tag pushes publish a release
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'

    # native arm64, so the image's chroot runs without qemu emulation
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          # scheduled builds use the latest image release's tag, everything else the commit that triggered it
          ref: ${{ needs.check.outputs.source_ref || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # the client from this same commit, so a release always contains the client it was tagged with
      - name: Build the client
        run: |
          pnpm install --frozen-lockfile --filter @pi-tray/client...
          pnpm --filter @pi-tray/client build

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y parted xz-utils

      # uses the exact image the check saw, in case a new one is released mid-run
      - name: Build the image
        run: |
          # scheduled builds rebuild the latest image tag, everything else builds the tag or commit that triggered it
          source_ref="${{ needs.check.outputs.source_ref || needs.check.outputs.release_tag }}"
          case "$source_ref" in
            image-v*) image_version="v${source_ref#image-v}" ;;
            *) image_version="dev-${GITHUB_SHA::7}" ;;
          esac

          base_image_url="${{ needs.check.outputs.base_image_url }}"
          base_image_name="$(basename "$base_image_url" .img.xz)"

          sudo PI_TRAY_IMAGE_NAME="pi-tray-$image_version-$base_image_name" bash ./apps/image/build/build-image.sh apps/client/dist out "$base_image_url"

      - name: Point the Imager list at this release
        if: needs.check.outputs.should_publish == 'true'
        run: sudo sed -i "s|PLACEHOLDER_URL|https://github.com/${{ github.repository }}/releases/download/${{ needs.check.outputs.release_tag }}|" out/os_list.json

      - name: Upload as a workflow artifact
        if: needs.check.outputs.should_publish == 'false' # only create an artifact for manual runs to avoid eating up quota
        uses: actions/upload-artifact@v4
        with:
          name: pi-tray-image
          path: out/*
          # already xz compressed
          compression-level: 0

          # keep artifacts for a few days, so they can be downloaded if needed, but free up space for new ones quickly
          retention-days: 3

      - name: Publish the release
        if: needs.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ needs.check.outputs.release_tag }}"

          # a release made in the web UI already exists, so attach to it, otherwise create one
          # never marked latest, as "latest" is shared with every other app's releases in the repo
          if gh release view "$release_tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$release_tag" out/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$release_tag" out/* --repo "${{ github.repository }}" --title "$release_tag" --generate-notes --latest=false
          fi

      # a fixed page for the newest image, as release search no longer matches tag names
      # Imager's repository url points at its os_list.json, so it always lists the newest image
      - name: Update the rolling image-latest release
        if: needs.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="${{ needs.check.outputs.release_tag }}"
          release_url="https://github.com/${{ github.repository }}/releases"

          if ! gh release view image-latest --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create image-latest --repo "${{ github.repository }}" --title "Latest Raspberry Pi image" --notes "" --latest=false
          fi

          # images are named by date, so the previous one doesn't get replaced by the upload and has to go first
          gh release view image-latest --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep '\.img\.xz$' | while IFS= read -r old_image; do
            gh release delete-asset image-latest "$old_image" --repo "${{ github.repository }}" --yes
          done

          gh release upload image-latest out/*.img.xz out/os_list.json --repo "${{ github.repository }}" --clobber

          gh release edit image-latest --repo "${{ github.repository }}" --title "Latest Raspberry Pi image" --notes "The newest Pi-Tray image, from [$release_tag]($release_url/tag/$release_tag). Download the \`.img.xz\` below.

          Flash it with Raspberry Pi Imager's **Use Custom**, or give Imager this repository so it can apply your settings: \`$release_url/download/image-latest/os_list.json\`

          See the [image's readme](https://github.com/${{ github.repository }}/blob/main/apps/image/README.md) for the details."
