name: Build editor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/editor/**"
      - "packages/types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-editor.yml"

# This workflow builds the Tauri app, caches dependencies, and uploads the binaries as artifacts.

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # for Intel based macs.
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest" # TODO: set up cross compilation to produce nsis on ubuntu
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # reads the version from the root package.json's packageManager field
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # caches pnpm's store, keyed on the lockfile
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      # CACHE APT PACKAGES (Ubuntu only)
      - name: Cache apt packages
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@v1.5.1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # CACHE RUST/CARGO DEPENDENCIES
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            apps/editor/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/editor/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # one install covers the editor, pi-tray-service and the shared packages
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This step builds the app.
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/editor
          # the lockfile is at the repo root, so tauri-action can't detect pnpm by itself
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

      # Prepare a multi-line list of artifact paths
      - name: Prepare artifact paths
        id: prep_paths
        shell: bash
        run: |
          # Begin a multi-line string for the 'paths' output variable
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"

          # Pipe the JSON into jq to create a clean, newline-separated list of paths
          # and append it to the output file
          echo '${{ steps.tauri-build.outputs.artifactPaths }}' | jq -r .[] >> "$GITHUB_OUTPUT"

          # End the multi-line string with the delimiter
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pi-tray-editor-${{ matrix.platform }}-${{ matrix.args || 'default' }}-${{ steps.tauri-build.outputs.appVersion }}
          path: ${{ steps.prep_paths.outputs.paths }}
